<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e2e8f0;
      }

      .card {
        text-align: center;
        padding: 64px 48px;
        max-width: 440px;
      }

      .dot-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 40px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #334155;
        animation: pulse 1.6s ease-in-out infinite;
      }

      .dot:nth-child(2) { animation-delay: .3s; }
      .dot:nth-child(3) { animation-delay: .6s; }

      @keyframes pulse {
        0%, 80%, 100% { background: #334155; transform: scale(1); }
        40% { background: #60a5fa; transform: scale(1.3); }
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -.5px;
        margin-bottom: 14px;
        color: #f1f5f9;
      }

      p {
        font-size: 1rem;
        color: #94a3b8;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot-row">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <h1>Coming Soon</h1>
      <p>We're working on something new.<br>Check back soon.</p>
    </div>
  </body>
</html>
